spring.application.name=backend
server.port=${PORT:8080}

# Base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cajas_literarias?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=120
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}